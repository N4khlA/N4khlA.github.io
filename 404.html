<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Finding: resource not found</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root { --paper:#f3f1ec; --ink:#0f0f10; --muted:#5d5d63; --hair:#cfcbc2; --accent:#d93a12; --accent-ink:#b32e0c; color-scheme: light; }
    @media (prefers-color-scheme: dark) { :root { --paper:#0f0f10; --ink:#f1eee7; --muted:#9d9a93; --hair:#2e2e31; --accent:#ff5a2e; --accent-ink:#ff7a55; color-scheme: dark; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px 16px; background: var(--paper); color: var(--ink); font: 500 16px/1.6 Inter, system-ui, sans-serif; }
    main { width: min(720px, 100%); border: 2px solid var(--ink); padding: 28px; box-shadow: 10px 10px 0 var(--accent); }
    .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
    .k { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
    h1 { font: 800 clamp(3.5rem, 2rem + 8vw, 7rem)/.9 Inter, sans-serif; letter-spacing: -.06em; margin: 12px 0 20px; }
    h1 span { color: var(--accent); }
    dl { margin: 0 0 24px; border-top: 2px solid var(--ink); }
    dl div { display: grid; grid-template-columns: 120px 1fr; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--hair); }
    dt { font-size: 11px; line-height: 2; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
    dd { margin: 0; overflow-wrap: anywhere; }
    a.btn { display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; background: var(--ink); color: var(--paper); text-decoration: none; font-size: 12px; text-transform: uppercase; letter-spacing: .1em; }
    a.btn:hover { background: var(--accent); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="k mono">Report GUERFI-A-Y-2026-001 · Finding F-404</p>
    <h1>404<span>.</span></h1>
    <dl>
      <div><dt class="mono">Severity</dt><dd>Informational</dd></div>
      <div><dt class="mono">Asset</dt><dd class="mono" id="path">/</dd></div>
      <div><dt class="mono">Description</dt><dd>The requested resource does not exist. No traversal or enumeration was required, just a wrong link.</dd></div>
      <div><dt class="mono">Remediation</dt><dd>Return to the report.</dd></div>
    </dl>
    <a class="btn mono" href="/">Back to report</a>
  </main>
  <script>document.getElementById('path').textContent = location.pathname;</script>
</body>
</html>
